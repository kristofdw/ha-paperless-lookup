version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned on purpose to the minimum supported Home Assistant version.
      - dependency-name: pytest-homeassistant-custom-component
      - dependency-name: homeassistant
      # mypy >= 2.2 needs a newer ast-serialize than the pinned test plugin allows.
      # Remove when the minimum Home Assistant version is raised.
      - dependency-name: mypy
        versions: [">=2.2"]
