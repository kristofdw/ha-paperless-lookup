name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit, ruff, mypy, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "minimum" = the locked versions (minimum supported Home Assistant, see hacs.json).
        # "latest" = the newest pytest-homeassistant on PyPI.
        ha: [minimum, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - if: matrix.ha == 'minimum'
        run: uv sync --locked
      - if: matrix.ha == 'latest'
        # Fresh venv without the lint pins (mypy etc.), which may not fit the newest package.
        run: |
          uv venv --python 3.14
          uv pip install pytest-homeassistant pytest-cov
          # The frontend package that this Home Assistant version pins (needed by panel_custom).
          uv pip install "$(.venv/bin/python -c "import importlib.util, json, pathlib; p = pathlib.Path(importlib.util.find_spec('homeassistant').origin).parent / 'components/frontend/manifest.json'; print(json.loads(p.read_text())['requirements'][0])")"
      - run: .venv/bin/pytest --cov-report=xml

  frontend:
    name: Frontend (typecheck, tests, build check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The Marketplace installs the committed bundle: it must match the sources.
      - run: git diff --exit-code -- ../custom_components/paperless_lookup/frontend/
