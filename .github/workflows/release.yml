name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag matches the manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with manifest.json
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(jq -r .version custom_components/paperless_lookup/manifest.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match manifest version v$version"
            exit 1
          fi
          grep -q "^## \[$version\] - " CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          }
          echo "Tag $TAG matches manifest version $version"
